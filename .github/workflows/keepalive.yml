name: Keep Supabase awake

# Supabase pauses free-tier projects after ~7 days with no activity. This app
# is used only occasionally, so a small scheduled request to the database keeps
# the project active and prevents the auto-pause. Runs every ~2 days (well
# inside the 7-day window, with margin for GitHub skipping scheduled runs).

on:
  schedule:
    - cron: '17 6 */2 * *' # ~every 2 days, off the top of the hour
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query the decks table (counts as project activity)
        run: |
          URL="https://alfitpzqcpwpktjgclhj.supabase.co"
          # anon public key (already public in the app config, safe here)
          KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFsZml0cHpxY3B3cGt0amdjbGhqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkwMTgwMTIsImV4cCI6MjEwNDU5NDAxMn0.6XYZ-JmZIgdcDXOJPBPhyY-abJKeKUlQIozgMPbZLNk"
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "$URL/rest/v1/decks?select=updated_at&limit=1" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          echo "Supabase REST responded: HTTP $code"
          # 200 (RLS returns []) means the database answered -> activity logged.
          if [ "$code" != "200" ]; then
            echo "Unexpected status; project may be down."
            exit 1
          fi
